server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve `bff` through Docker's DNS every few seconds, not once at startup: `--watch`
  # recreates the BFF container on every save, and it may come back on a different IP.
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $bff http://bff:8080;
    proxy_pass $bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server-Sent Events: forward every event immediately instead of buffering the response.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
