server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server-Sent Events: forward every event immediately instead of buffering the response.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
